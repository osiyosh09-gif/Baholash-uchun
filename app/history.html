<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>История отчётов — THE BEST VALUATION</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:      #1a56db;
      --primary-dark: #1e429f;
      --primary-light:#ebf5ff;
      --danger:       #e02424;
      --danger-light: #fde8e8;
      --success:      #057a55;
      --bg:           #f3f4f6;
      --bg-white:     #ffffff;
      --border:       #d1d5db;
      --border-light: #e5e7eb;
      --text:         #111827;
      --text-muted:   #6b7280;
      --shadow:       0 1px 4px rgba(0,0,0,0.10);
      --radius:       8px;
      --radius-sm:    4px;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER */
    .hist-header {
      background: linear-gradient(135deg, #1a56db, #1e429f);
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(26,86,219,0.4);
      flex-shrink: 0;
    }
    .hist-header h1 { font-size: 16px; font-weight: 700; }
    .hist-header span { font-size: 11px; opacity: 0.82; }

    /* TOOLBAR */
    .hist-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--primary); }

    .hist-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* TABLE AREA */
    .hist-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60%;
      color: var(--text-muted);
      gap: 10px;
    }
    .empty-state .empty-icon { font-size: 48px; }
    .empty-state p { font-size: 14px; }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .report-card {
      background: var(--bg-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      transition: box-shadow 0.15s, transform 0.15s;
      cursor: pointer;
    }
    .report-card:hover {
      box-shadow: 0 4px 14px rgba(26,86,219,0.15);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .card-date {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--primary-light);
      border-radius: 10px;
      padding: 2px 8px;
    }

    .card-car {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-plate {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      color: #1e429f;
      background: #e8f0fe;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-sm);
      padding: 2px 8px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .card-client {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-total {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--border-light);
      padding-top: 10px;
    }

    .btn-card {
      flex: 1;
      padding: 6px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-open {
      background: var(--primary);
      color: white;
    }
    .btn-open:hover { background: var(--primary-dark); }

    .btn-pdf {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #bfdbfe !important;
    }
    .btn-pdf:hover { background: var(--primary); color: white; }

    .btn-del {
      background: var(--danger-light);
      color: var(--danger);
      flex: 0 0 auto;
      padding: 6px 10px;
    }
    .btn-del:hover { background: var(--danger); color: white; }

    /* LANG BADGE */
    .lang-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 6px;
      background: #fef3c7;
      color: #92400e;
      vertical-align: middle;
    }

    /* FOOTER */
    .hist-footer {
      padding: 8px 16px;
      background: #1f2937;
      color: #9ca3af;
      font-size: 11.5px;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:#f1f1f1; }
    ::-webkit-scrollbar-thumb { background:#c5c9d1; border-radius:3px; }
  </style>
</head>
<body>

  <div class="hist-header">
    <div>
      <h1>📋 История отчётов</h1>
      <span>THE BEST VALUATION — база данных</span>
    </div>
  </div>

  <div class="hist-toolbar">
    <input class="search-input" id="search-input"
           placeholder="🔍 Поиск по номеру, заказчику, авто..."
           oninput="filterCards()"/>
    <span class="hist-count" id="hist-count">0 та</span>
  </div>

  <div class="hist-body" id="hist-body">
    <div class="empty-state" id="empty-state">
      <span class="empty-icon">📂</span>
      <p>Hisobotlar yo'q</p>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div class="hist-footer">
    <span>ООО «THE BEST VALUATION» © 2026</span>
    <span id="footer-total-count">Jami: 0 ta hisobot</span>
  </div>

  <script src="history.js"></script>
</body>
</html>
